[project]
name = "librivox-mult"
version = "0.0.1"
description = "LibriVox multi-reading corpus: alignment and speaker attribution"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "mosestokenizer>=1.2.1",
    "num2words>=0.5.14",
    "numpy>=1.26",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
lvm-survey = "librivox_mult.stage0_survey:main"
lvm-text = "librivox_mult.stage1_text:main"
lvm-headers = "librivox_mult.stage2_headers:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librivox_mult"]

[tool.pytest.ini_options]
testpaths = ["tests"]
