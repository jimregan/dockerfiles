# Fedora Core 3 kickstart
lang en_US
langsupport --default=en_US en_US
keyboard us
mouse generic3ps/2 --device psaux
timezone --utc UTC
auth --enableshadow --enablemd5

install
network --device eth0 --bootproto dhcp --hostname localhost.localdomain
url --url @INSTALL_URL@/

skipx
cmdline
reboot

bootloader --location=mbr --driveorder=hda
zerombr
clearpart --all --drives=hda --initlabel

part /boot --fstype ext3 --size=100 --ondisk=hda
part swap  --size=256 --ondisk=hda
part /     --fstype ext3 --size=3000 --grow --ondisk=hda

rootpw rootpassword
firewall --disabled

%packages
@ X Window System
@ GNOME Desktop
@ Development Tools
gcc
make
rpm-build
patch
tar
binutils

tcl
tk

openssh
openssh-server
openssh-clients

mozilla
wget

alsa-utils

%post
cat > /etc/resolv.conf <<'EOF'
nameserver 10.0.2.3
EOF

grep -q 'www.speech.kth.se' /etc/hosts || echo '10.0.2.2 www.speech.kth.se' >> /etc/hosts

cat > /etc/sysconfig/network <<'EOF'
NETWORKING=yes
HOSTNAME=localhost.localdomain
GATEWAY=10.0.2.2
GATEWAYDEV=eth0
EOF

cat > /etc/sysconfig/network-scripts/ifcfg-eth0 <<'EOF'
DEVICE=eth0
BOOTPROTO=dhcp
ONBOOT=yes
USERCTL=no
PEERDNS=no
TYPE=Ethernet
EOF

cat >> /etc/rc.d/rc.local <<'EOF'

/sbin/route -n | awk '$1 == "0.0.0.0" { found = 1 } END { exit found ? 0 : 1 }' || /sbin/route add default gw 10.0.2.2 eth0
EOF

grep -q '^alias eth0 8139too$' /etc/modprobe.conf || echo 'alias eth0 8139too' >> /etc/modprobe.conf
grep -q '^alias snd-card-0 snd-ens1370$' /etc/modprobe.conf || echo 'alias snd-card-0 snd-ens1370' >> /etc/modprobe.conf
grep -q '^alias sound-slot-0 snd-card-0$' /etc/modprobe.conf || echo 'alias sound-slot-0 snd-card-0' >> /etc/modprobe.conf
grep -q '^options snd-card-0 index=0$' /etc/modprobe.conf || echo 'options snd-card-0 index=0' >> /etc/modprobe.conf
/sbin/modprobe snd-pcm-oss
/sbin/modprobe snd-mixer-oss
/dev/MAKEDEV audio
/sbin/chkconfig alsasound on
/sbin/chkconfig sshd on

# Fresh kickstart installs never run GNOME's first-login druid, so
# /system/gstreamer/0.8/default/audiosink is unset: gconfaudiosink's
# internal bin ends up with no sink element, and gstreamer throws a
# generic "Pad problem. File a bug" instead of playing anything.
gconftool-2 --direct \
    --config-source xml:readwrite:/etc/gconf/gconf.xml.mandatory \
    --type string \
    --set /system/gstreamer/0.8/default/audiosink alsasink

wget -q @INSTALL_URL@/extra-rpms/tclplugin.rpm -O /tmp/tclplugin.rpm
rpm -ivh /tmp/tclplugin.rpm
wget -q @INSTALL_URL@/extra-rpms/snack.rpm -O /tmp/snack.rpm
rpm -ivh /tmp/snack.rpm

cat > /etc/X11/xorg.conf <<'EOF'
Section "ServerLayout"
    Identifier "Default Layout"
    Screen 0 "Screen0" 0 0
    InputDevice "Mouse0" "CorePointer"
    InputDevice "Keyboard0" "CoreKeyboard"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "kbd"
    Option "XkbModel" "pc105"
    Option "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "mouse"
    Option "Protocol" "IMPS/2"
    Option "Device" "/dev/input/mice"
    Option "ZAxisMapping" "4 5"
EndSection

Section "Device"
    Identifier "Videocard0"
    Driver "cirrus"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 31.5-48.5
    VertRefresh 50-70
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Videocard0"
    Monitor "Monitor0"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "1024x768" "800x600"
    EndSubSection
EndSection
EOF

cat > /root/.tclpluginrc <<'EOF'
proc siteInit {} {}

proc siteSafeInit {slave args} {
    ::safe::interpAddToAccessPath $slave /usr/lib/snack2.2
}
EOF

cat > /root/.xinitrc <<'EOF'
xset -dpms 2>/dev/null || true
xset s off 2>/dev/null || true
xset s noblank 2>/dev/null || true
mozilla -geometry 1024x768+0+0 http://www.speech.kth.se/labs/analysis/ &
exec gnome-session
EOF
chmod +x /root/.xinitrc

cat >> /etc/rc.d/rc.local <<'EOF'

if [ -x /usr/X11R6/bin/startx ]; then
    su - root -c 'startx -- :0' >/var/log/startx.log 2>&1 &
fi
EOF
