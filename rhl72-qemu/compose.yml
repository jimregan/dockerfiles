services:

  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: rhl72-base

  # --- Interactive VM: use this to develop the RPM spec ---
  interactive:
    build:
      context: .
      dockerfile: Dockerfile.interactive
    image: rhl72-interactive
    privileged: true        # needed for /dev/kvm and loop mounts
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - rhl72-disk:/disk
      - ./isos:/rhl72/isos:ro
    ports:
      - "6080:6080"         # noVNC — open http://localhost:6080/vnc.html in a browser
      - "2222:2222"         # SSH inside the VM

  # --- Final image: Mozilla + Tcl Plugin installed, ready to browse ---
  final:
    build:
      context: .
      dockerfile: Dockerfile.final
    image: rhl72-final
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "6080:6080"
    profiles:
      - final

  # --- Automated build: produces the RPM ---
  build:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: rhl72-build
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - ./output:/output
    profiles:
      - build               # only runs when explicitly requested

volumes:
  rhl72-disk:
