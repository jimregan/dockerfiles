services:

  interactive:
    build:
      context: .
      dockerfile: Dockerfile.interactive
    image: rhl72-interactive
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "6080:6080"
      - "2222:2222"
    volumes:
      - ./rpmbuild:/workspace/rpmbuild

  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    image: rhl72-builder
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - ./rpmbuild:/rpmbuild:ro
      - ./output:/output
    profiles:
      - build

  final:
    build:
      context: .
      dockerfile: Dockerfile.final
    image: rhl72-final
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "6080:6080"
      - "2222:2222"
    profiles:
      - final
