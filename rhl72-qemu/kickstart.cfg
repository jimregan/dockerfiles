# Red Hat Linux 7.2 kickstart
lang en_US
langsupport --default=en_US en_US
keyboard us
mouse generic3ps/2 --device psaux
timezone --utc UTC
auth --enableshadow --enablemd5

install
harddrive --partition hdb --dir /

skipx
text
reboot

lilo --location=mbr
zerombr yes
clearpart --all

part /boot --fstype ext2 --size=100 --ondisk=hda
part swap  --size=256
part /     --fstype ext2 --size=3000 --grow --ondisk=hda

network --bootproto=dhcp --device=eth0
rootpw rootpassword
firewall --disabled

%packages --resolvedeps
@ X Window System
@ Software Development
@ GNOME
gcc
make
rpm-build
patch
tar
binutils

tcl
tk

openssh
openssh-server
openssh-clients

XFree86
XFree86-libs
XFree86-xfs
XFree86-base-fonts
XFree86-75dpi-fonts
XFree86-100dpi-fonts
XFree86-tools
XFree86-twm
xinitrc
mozilla

%post
mkdir -p /etc/X11

if [ -x /usr/X11R6/bin/XFree86 ]; then
    ln -sf ../../usr/X11R6/bin/XFree86 /etc/X11/X
fi

cat > /etc/X11/XF86Config <<'EOF'
Section "Files"
    FontPath "unix/:7100"
    FontPath "/usr/X11R6/lib/X11/fonts/misc:unscaled"
    FontPath "/usr/X11R6/lib/X11/fonts/75dpi:unscaled"
    FontPath "/usr/X11R6/lib/X11/fonts/100dpi:unscaled"
    FontPath "/usr/X11R6/lib/X11/fonts/Type1"
    FontPath "/usr/X11R6/lib/X11/fonts/Speedo"
EndSection

Section "ServerFlags"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "keyboard"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "mouse"
    Option "Protocol" "PS/2"
    Option "Device" "/dev/psaux"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 31.5-57.0
    VertRefresh 50-90
EndSection

Section "Device"
    Identifier "Videocard0"
    Driver "cirrus"
    VideoRam 4096
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Videocard0"
    Monitor "Monitor0"
    DefaultDepth 16

    SubSection "Display"
        Depth 16
        Modes "1024x768" "800x600" "640x480"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Default Layout"
    Screen "Screen0"
    InputDevice "Mouse0" "CorePointer"
    InputDevice "Keyboard0" "CoreKeyboard"
EndSection
EOF

chkconfig xfs on || true
