# Red Hat Linux 7.2 kickstart
# Install from local HTTP server (served by the Docker host via prep-tree.sh)
# Target: build the Netscape Tcl Plugin (NPAPI plugin for running Tcl/Tk in-browser)

lang en_US
langsupport --default=en_US en_US
keyboard us
timezone --utc UTC

install
url --url http://10.0.2.2:8080

skipx
text

bootloader --location=mbr
zerombr yes
clearpart --all --initlabel

part /boot --fstype ext3 --size=100 --asprimary
part swap  --size=256
part /     --fstype ext3 --size=1 --grow

network --bootproto=dhcp --device=eth0

rootpw --plaintext rootpassword

# Keep firewall out of the way
firewall --disabled

%packages
# Core
bash
coreutils
glibc
glibc-devel

# Build tools
gcc
make
rpm-build
patch
diffutils
findutils
gzip
tar
binutils

# Tcl + Tk (plugin needs Tk for widget embedding)
tcl
tcl-devel
tk
tk-devel

# X11 devel (needed for Tk and the plugin's display code)
XFree86
XFree86-devel
XFree86-libs
XFree86-tools
XFree86-xfs
XFree86-75dpi-fonts
XFree86-100dpi-fonts
xinitrc
twm

# Mozilla (RHL 7.2 ships Mozilla 0.9.4 — same NPAPI interface as Netscape)
mozilla

# SSH so we can drive the VM non-interactively
openssh-server
openssh-clients

%post
# Enable SSH on boot
chkconfig sshd on
chkconfig xfs on

# Set up rpmbuild directory tree
mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
echo '%_topdir /root/rpmbuild' > /root/.rpmmacros

# Allow root SSH login (this is an isolated VM, not production)
sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/' /etc/ssh/sshd_config

# Static XFree86 config for QEMU's default Cirrus VGA.
cat > /etc/X11/XF86Config-4 <<'EOF'
Section "ServerLayout"
    Identifier "Default Layout"
    Screen "Screen0"
    InputDevice "Mouse0" "CorePointer"
    InputDevice "Keyboard0" "CoreKeyboard"
EndSection

Section "Files"
    FontPath "unix/:7100"
    FontPath "/usr/X11R6/lib/X11/fonts/misc"
    FontPath "/usr/X11R6/lib/X11/fonts/75dpi"
    FontPath "/usr/X11R6/lib/X11/fonts/100dpi"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "keyboard"
    Option "XkbModel" "pc101"
    Option "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "mouse"
    Option "Protocol" "PS/2"
    Option "Device" "/dev/psaux"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 31.5-48.5
    VertRefresh 50-70
EndSection

Section "Device"
    Identifier "Videocard0"
    Driver "cirrus"
    VideoRam 4096
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Videocard0"
    Monitor "Monitor0"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "1024x768" "800x600"
    EndSubSection
EndSection
EOF

ln -sf /etc/X11/XF86Config-4 /etc/X11/XF86Config
