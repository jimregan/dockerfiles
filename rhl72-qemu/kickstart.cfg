# Red Hat Linux 7.2 kickstart
# Install from local HTTP server (served by the Docker host via prep-tree.sh)
# Target: build the Netscape Tcl Plugin (NPAPI plugin for running Tcl/Tk in-browser)

lang en_US
langsupport --default=en_US en_US
keyboard us
timezone --utc UTC

install
url --url http://10.0.2.2:8080/rhl72

# Headless, no X
skipx
text

bootloader --location=mbr
zerombr yes
clearpart --all

part /boot --fstype ext3 --size=100
part swap  --size=256
part /     --fstype ext3 --size=1 --grow

network --bootproto=dhcp --device=eth0

rootpw --plaintext rootpassword

# Keep firewall out of the way
firewall --disabled

%packages
# Core
bash
coreutils
glibc
glibc-devel

# Build tools
gcc
make
rpm-build
patch
diffutils
findutils
gzip
tar
binutils

# Tcl + Tk (plugin needs Tk for widget embedding)
tcl
tcl-devel
tk
tk-devel

# X11 devel (needed for Tk and the plugin's display code)
XFree86-devel
XFree86-libs

# Mozilla (RHL 7.2 ships Mozilla 0.9.4 — same NPAPI interface as Netscape)
mozilla

# SSH so we can drive the VM non-interactively
openssh-server
openssh-clients

%post
# Enable SSH on boot
chkconfig sshd on

# Set up rpmbuild directory tree
mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
echo '%_topdir /root/rpmbuild' > /root/.rpmmacros

# Allow root SSH login (this is an isolated VM, not production)
sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/' /etc/ssh/sshd_config
