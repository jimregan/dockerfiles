# Red Hat Linux 7.2 kickstart
# Install from a boot floppy using a HTTP package tree.
# Keep this initial install conservative; later Docker stages customize the VM.

lang en_US
langsupport --default=en_US en_US
keyboard us
timezone --utc UTC

install
url --url http://10.0.2.2:8080

skipx
text

bootloader --location=mbr
zerombr yes
clearpart --all --drives=hda

part /boot --fstype ext2 --size=100 --ondisk=hda
part swap  --size=256
part /     --fstype ext2 --size=3000 --grow --ondisk=hda

network --bootproto=dhcp --device=eth0

rootpw --plaintext rootpassword

# Keep firewall out of the way
firewall --disabled

%packages
@ Base

gcc
make
rpm-build
patch
tar
binutils

tcl
tcl-devel
tk
tk-devel

openssh-server
openssh-clients

%post
# Enable SSH on boot
chkconfig sshd on

# Set up rpmbuild directory tree
mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
echo '%_topdir /root/rpmbuild' > /root/.rpmmacros

# Allow root SSH login (this is an isolated VM, not production)
sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/' /etc/ssh/sshd_config
